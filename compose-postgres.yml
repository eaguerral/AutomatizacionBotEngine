services:

  postgres:

    image: postgres:17

    container_name: automatizacion_botengine_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${BOTENGINE_DB_NAME}
      POSTGRES_USER: ${BOTENGINE_DB_USER}
      POSTGRES_PASSWORD: ${BOTENGINE_DB_PASSWORD}

    ports:
      - "127.0.0.1:${BOTENGINE_DB_PORT}:5432"

    volumes:
      - automatizacion_botengine_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BOTENGINE_DB_USER} -d ${BOTENGINE_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:

  automatizacion_botengine_pgdata: