<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo usuario | Bot Engine</title>
    <link rel="stylesheet" href="/css/botengine.css">
    <script src="/js/theme.js"></script>
</head>

<body>

<header class="header">

    <div class="container nav portal-nav">

        <div class="nav-left">

            <button
                type="button"
                class="back-nav"
                onclick="window.location.href='/';"
                title="Regresar"
                aria-label="Regresar">

                <svg viewBox="0 0 24 24"
                     aria-hidden="true">

                    <path d="M15 18l-6-6 6-6"/>

                </svg>

            </button>


            <details class="profile-menu">

                <summary
                    class="profile-trigger"
                    title="Perfil de usuario">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true">

                        <circle
                            cx="12"
                            cy="8"
                            r="4">
                        </circle>

                        <path
                            d="M4 20c0-4.1 3.6-7 8-7s8 2.9 8 7">
                        </path>

                    </svg>

                </summary>

                <div class="profile-dropdown">

                    <div class="profile-summary">

                        <div class="profile-small-avatar">

                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <circle
                                    cx="12"
                                    cy="8"
                                    r="4">
                                </circle>

                                <path
                                    d="M4 20c0-4.1 3.6-7 8-7s8 2.9 8 7">
                                </path>

                            </svg>

                        </div>

                        <div>

                            <strong
                                sec:authentication="name">
                                usuario
                            </strong>

                            <small>
                                Cuenta del portal
                            </small>

                        </div>

                    </div>

                    <div class="profile-divider"></div>

                    <a href="/perfil"
                       class="profile-option">

                        <span>Editar perfil</span>

                    </a>

                    <a href="/configuracion"
                       class="profile-option">

                        <span>Configuracion</span>

                    </a>

                    <div class="profile-divider"></div>

                    <form
                        th:action="@{/logout}"
                        method="post">

                        <button
                            type="submit"
                            class="profile-option profile-logout">

                            Cerrar sesion

                        </button>

                    </form>

                </div>

            </details>

            <a href="/"
               class="brand">
                Bot Engine
            </a>

            <span class="brand-badge">
                Automation Portal
            </span>

        </div>

        <nav class="menu">

            <a href="/#inicio">
                Inicio
            </a>

            <a href="/#modulos">
                Modulos
            </a>

            <a href="/automatizaciones">
                Automatizaciones
            </a>

            <a href="/#estado">
                Estado
            </a>

        </nav>

    </div>

</header>

<main>

    <section class="hero">

        <div class="container hero-wrap">

            <div class="hero-text">

                <span class="brand-badge">
                    Administracion
                </span>

                <h1>
                    Nuevo usuario
                </h1>

                <p class="lead">
                    Registro de una nueva cuenta con acceso
                    controlado por rol.
                </p>

            </div>

        </div>

    </section>

    <div class="strip"></div>

    <section>

        <div class="container">

            <div class="user-form-panel">

                <div th:if="${error != null}"
                     class="form-error"
                     th:text="${error}">
                    Error
                </div>

                <form
                    th:action="@{/usuarios/nuevo}"
                    th:object="${usuarioForm}"
                    method="post"
                    autocomplete="off">

                    <div class="form-grid">

                        <div class="form-field">
                            <label>Nombre completo</label>

                            <input
                                type="text"
                                th:field="*{nombreCompleto}"
                                required
                                maxlength="120">
                        </div>

                        <div class="form-field">
                            <label>Usuario</label>

                            <input
                                type="text"
                                th:field="*{username}"
                                autocomplete="off"
                                required
                                maxlength="80">
                        </div>

                        <div class="form-field">
                            <label>Correo</label>

                            <input
                                type="email"
                                th:field="*{email}"
                                maxlength="150">
                        </div>

                        <div class="form-field">
                            <label>Contraseña</label>

                            <input
                                type="password"
                                th:field="*{password}"
                                autocomplete="new-password"
                                required
                                minlength="8">
                        </div>

                        <div class="form-field">
                            <label>Rol</label>

                            <select
                                th:field="*{rolId}"
                                required>

                                <option value="">
                                    Seleccione un rol
                                </option>

                                <option
                                    th:each="rol : ${roles}"
                                    th:value="${rol.id}"
                                    th:text="${rol.nombre}">
                                    ADMIN
                                </option>

                            </select>
                        </div>

                        <div class="form-field checkbox-field">

                            <label>
                                <input
                                    type="checkbox"
                                    th:field="*{activo}">

                                Usuario activo
                            </label>

                        </div>

                    </div>

                    <div class="form-actions">

                        <a href="/usuarios"
                           class="btn secondary">
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn">
                            Guardar usuario
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

</main>

</body>
</html>
